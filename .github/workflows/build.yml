name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  native-host:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bygg SithsWebLogin.exe
        shell: cmd
        run: native-host\build.cmd

      - name: Kontrollera exempelkonfigurationen
        shell: powershell
        run: |
          $asm = [Reflection.Assembly]::Load([IO.File]::ReadAllBytes("native-host\bin\SithsWebLogin.exe"))
          $cfg = $asm.GetType("SithsWebLogin.HostConfig").GetMethod("Load").Invoke($null, @((Resolve-Path "native-host\siths-host.example.json").Path))
          if ($cfg.HostName -ne "org.example.siths") { throw "Konfigurationen lästes fel" }

      - name: Paketera exempel-deployment
        shell: powershell
        run: tools\package.ps1 -Deployment deployments\example.json

      # Signering: när projektet godkänts av SignPath Foundation läggs deras action in här
      # (signpath/github-action-submit-signing-request) och signerar artefakten nedan.

      - uses: actions/upload-artifact@v4
        with:
          name: SithsWebLogin
          path: native-host/bin/SithsWebLogin.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            native-host/bin/SithsWebLogin.exe
            native-host/siths-host.example.json

  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntaxkontroll
        run: find example-server-php -name '*.php' -print0 | xargs -0 -n1 php -l
